<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2640"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#ffd3a1"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#1f7a35"/>
    </linearGradient>
    <linearGradient id="peak2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#145a27"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="8" y="8" width="240" height="240" rx="52"/>
    </clipPath>
    <clipPath id="photo">
      <rect x="88" y="104" width="128" height="96" rx="10"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">
    <!-- code lines: a key and a long base64 string -->
    <rect x="36" y="46" width="34" height="11" rx="5.5" fill="#9cdcfe" fill-opacity="0.85"/>
    <rect x="78" y="46" width="142" height="11" rx="5.5" fill="#ce9178"/>

    <!-- hover card popping out of the string -->
    <g filter="url(#shadow)">
      <path d="M78 92 h132 a12 12 0 0 1 12 12 v100 a12 12 0 0 1 -12 12 h-132 a12 12 0 0 1 -12 -12 v-100 a12 12 0 0 1 12 -12 z" fill="#252b38"/>
      <path d="M134 93 l14 -26 l14 26 z" fill="#252b38"/>
    </g>
    <path d="M78 92 h132 a12 12 0 0 1 12 12 v100 a12 12 0 0 1 -12 12 h-132 a12 12 0 0 1 -12 -12 v-100 a12 12 0 0 1 12 -12 z" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <!-- the picture inside the card -->
    <g clip-path="url(#photo)">
      <rect x="88" y="104" width="128" height="96" fill="url(#sky)"/>
      <circle cx="184" cy="132" r="13" fill="#fbbf24"/>
      <path d="M80 200 L130 140 L160 172 L184 150 L224 200 Z" fill="url(#peak)"/>
      <path d="M80 200 L112 162 L150 200 Z" fill="url(#peak2)"/>
    </g>
  </g>

  <rect x="9" y="9" width="238" height="238" rx="51" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
